# Based on GTSAM file (by @ProfFan)
name: CI Linux

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      CTEST_PARALLEL_LEVEL: 1
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      VERBOSE: 1  # to show all cmake scripts debug info

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [
          ubuntu-26.04-clang-mrpt3-stable,
          ubuntu-26.04-clang-mrpt3-develop,
          ubuntu-26.04-gcc-mrpt3-stable,
          ubuntu-26.04-gcc-mrpt3-develop,
          ubuntu-24.04-clang-mrpt3-stable,
          ubuntu-24.04-clang-mrpt3-develop,
          ubuntu-24.04-gcc-mrpt3-stable,
          ubuntu-24.04-gcc-mrpt3-develop,
        ]

        build_type: [ Release ]
        include:
          - name: ubuntu-26.04-clang-mrpt3-stable
            os: ubuntu-26.04
            compiler: clang
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-26.04-clang-mrpt3-develop
            os: ubuntu-26.04
            compiler: clang
            mrpt_ppa: mrpt3-develop

          - name: ubuntu-26.04-gcc-mrpt3-stable
            os: ubuntu-26.04
            compiler: gcc
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-26.04-gcc-mrpt3-develop
            os: ubuntu-26.04
            compiler: gcc
            mrpt_ppa: mrpt3-develop

          - name: ubuntu-24.04-clang-mrpt3-stable
            os: ubuntu-24.04
            compiler: clang
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-24.04-clang-mrpt3-develop
            os: ubuntu-24.04
            compiler: clang
            mrpt_ppa: mrpt3-develop

          - name: ubuntu-24.04-gcc-mrpt3-stable
            os: ubuntu-24.04
            compiler: gcc
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-24.04-gcc-mrpt3-develop
            os: ubuntu-24.04
            compiler: gcc
            mrpt_ppa: mrpt3-develop

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Git submodule
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.ref }}-
            ccache-${{ matrix.name }}-${{ matrix.build_type }}-

      - name: Install Dependencies
        run: |
          # See bug/issue: https://github.com/orgs/community/discussions/47863
          sudo apt-mark hold grub-efi-amd64-signed

          sudo apt-get -y update
          sudo apt-get -y upgrade

          sudo apt install software-properties-common -yq
          sudo add-apt-repository ppa:joseluisblancoc/${{ matrix.mrpt_ppa }} -y

          sudo apt install -y \
            cmake build-essential cmake \
            libbox2d-dev \
            libcli11-dev \
            libnanoflann-dev \
            libmrpt-opengl-dev libmrpt-obs-dev libmrpt-maps-dev \
            libmrpt-topography-dev \
            libmrpt-gui-dev libmrpt-nanogui-dev libmrpt-tfest-dev \
            protobuf-compiler \
            libzmq3-dev \
            pybind11-dev \
            libprotobuf-dev \
            libpython3-dev \
            libtbb-dev \
            python3-pip \
            python3-virtualenv \
            python3-protobuf

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++ g++
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang g++-multilib
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: CMake configure
        run: |
          cmake -DCMAKE_VERBOSE_MAKEFILE=ON \
                -H. -Bbuild

      - name: Build
        run: |
          make -C build
          
      - name: Run tests
        run: |
          ctest --verbose --test-dir build

# Based on GTSAM file (by @ProfFan)
name: CI Linux

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      CTEST_PARALLEL_LEVEL: 1
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      VERBOSE: 1  # to show all cmake scripts debug info

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [
          ubuntu-26.04-clang-mrpt3-stable,
          ubuntu-26.04-clang-mrpt3-develop,
          ubuntu-26.04-gcc-mrpt3-stable,
          ubuntu-26.04-gcc-mrpt3-develop,
          ubuntu-24.04-clang-mrpt3-stable,
          ubuntu-24.04-clang-mrpt3-develop,
          ubuntu-24.04-gcc-mrpt3-stable,
          ubuntu-24.04-gcc-mrpt3-develop,
          ubuntu-24.04-gcc-mrpt3-stable-protobuf-upstream,
        ]

        build_type: [ Release ]
        include:
          - name: ubuntu-26.04-clang-mrpt3-stable
            os: ubuntu-26.04
            compiler: clang
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-26.04-clang-mrpt3-develop
            os: ubuntu-26.04
            compiler: clang
            mrpt_ppa: mrpt3-develop

          - name: ubuntu-26.04-gcc-mrpt3-stable
            os: ubuntu-26.04
            compiler: gcc
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-26.04-gcc-mrpt3-develop
            os: ubuntu-26.04
            compiler: gcc
            mrpt_ppa: mrpt3-develop

          - name: ubuntu-24.04-clang-mrpt3-stable
            os: ubuntu-24.04
            compiler: clang
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-24.04-clang-mrpt3-develop
            os: ubuntu-24.04
            compiler: clang
            mrpt_ppa: mrpt3-develop

          - name: ubuntu-24.04-gcc-mrpt3-stable
            os: ubuntu-24.04
            compiler: gcc
            mrpt_ppa: mrpt3-stable

          - name: ubuntu-24.04-gcc-mrpt3-develop
            os: ubuntu-24.04
            compiler: gcc
            mrpt_ppa: mrpt3-develop

          # Distros and ROS 2 ship protobuf 3.x: build a recent upstream release
          # instead, pinned so new releases are adopted on purpose (bump both).
          # gcc, since clang builds skip the Python wrappers.
          - name: ubuntu-24.04-gcc-mrpt3-stable-protobuf-upstream
            os: ubuntu-24.04
            compiler: gcc
            mrpt_ppa: mrpt3-stable
            protobuf_version: "36.2"
            protobuf_python_version: "7.36.2"

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Git submodule
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.ref }}-
            ccache-${{ matrix.name }}-${{ matrix.build_type }}-

      - name: Install Dependencies
        run: |
          # See bug/issue: https://github.com/orgs/community/discussions/47863
          sudo apt-mark hold grub-efi-amd64-signed
          # The preinstalled firefox deb-to-snap transitional package fails to
          # upgrade on runners, breaking "apt-get upgrade" randomly:
          sudo apt-mark hold firefox || true

          sudo apt-get -y update
          sudo apt-get -y upgrade

          sudo apt install software-properties-common -yq
          sudo add-apt-repository ppa:joseluisblancoc/${{ matrix.mrpt_ppa }} -y

          sudo apt install -y \
            cmake build-essential cmake \
            libbox2d-dev \
            libcli11-dev \
            libnanoflann-dev \
            libmrpt-opengl-dev libmrpt-obs-dev libmrpt-maps-dev \
            libmrpt-topography-dev \
            libmrpt-imgui-dev libmrpt-imgui-vendor-dev libglfw3-dev libmrpt-tfest-dev \
            libzmq3-dev \
            pybind11-dev \
            libpython3-dev \
            libtbb-dev \
            python3-pip \
            python3-virtualenv

          if [ -z "${{ matrix.protobuf_version }}" ]; then
            sudo apt install -y protobuf-compiler libprotobuf-dev python3-protobuf
          fi

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++ g++
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang g++-multilib
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Restore protobuf
        if: matrix.protobuf_version
        id: protobuf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/protobuf
          key: protobuf-${{ matrix.protobuf_version }}-${{ matrix.os }}-${{ matrix.compiler }}

      - name: Build protobuf
        if: matrix.protobuf_version && steps.protobuf-cache.outputs.cache-hit != 'true'
        run: |
          V=${{ matrix.protobuf_version }}
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v$V/protobuf-$V.tar.gz | tar xz -C /tmp
          cmake -S /tmp/protobuf-$V -B /tmp/protobuf-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/protobuf \
                -DBUILD_SHARED_LIBS=ON \
                -Dprotobuf_BUILD_TESTS=OFF \
                -Dprotobuf_FORCE_FETCH_DEPENDENCIES=ON
          cmake --build /tmp/protobuf-build -j$(nproc)
          cmake --install /tmp/protobuf-build

      # Saved right away, so a failing mvsim build does not rebuild it next time:
      - name: Save protobuf
        if: matrix.protobuf_version && steps.protobuf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/protobuf
          key: ${{ steps.protobuf-cache.outputs.cache-primary-key }}

      - name: Use protobuf ${{ matrix.protobuf_version }}
        if: matrix.protobuf_version
        run: |
          echo "CMAKE_PREFIX_PATH=$HOME/protobuf" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/protobuf/lib" >> $GITHUB_ENV
          echo "$HOME/protobuf/bin" >> $GITHUB_PATH
          # Python runtime of the same release, for the generated *_pb2.py modules:
          python3 -m pip install --user --break-system-packages protobuf==${{ matrix.protobuf_python_version }}

      - name: CMake configure
        run: |
          cmake -DCMAKE_VERBOSE_MAKEFILE=ON \
                -H. -Bbuild

          # Without protobuf, mvsim silently drops comms: make sure the pinned one was used.
          if [ -n "${{ matrix.protobuf_version }}" ]; then
            grep "^Protobuf_DIR:PATH=$HOME/protobuf/" build/CMakeCache.txt
          fi

      - name: Build
        run: |
          make -C build
          
      - name: Run tests
        run: |
          ctest --verbose --test-dir build

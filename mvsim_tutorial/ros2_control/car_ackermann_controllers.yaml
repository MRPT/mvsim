# ros2_control controllers for the "car_ackermann" vehicle (class "ackermann":
# one motor per wheel), used with: <controller class="ros2_control">, and
# <steering_joints>per_wheel</steering_joints> (two front steering joints).
#
# ackermann_steering_controller drives the two rear wheels (velocity) and
# steers each front wheel (position). Its geometry must match the vehicle XML
# (definitions/ackermann.vehicle.xml). The odometry of the steering controllers
# is that of the rear axle center, so the vehicle origin (base_link) must be
# there: rear wheels at x=0.
#
# Controller manager: "/controller_manager" for one vehicle, or
# "/<VEHICLE>/controller_manager" with several ones. The "/**/" prefix makes
# these parameters apply in any namespace.
/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz. The simulation rate should be a multiple of this.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

/**/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/**/ackermann_steering_controller:
  ros__parameters:
    use_sim_time: true

    # Joints, right then left. Wheel joints: "joint_name" attribute of the
    # wheel, or "<wheel tag>_joint" by default. Steering joints:
    # <fl_steer_joint_name>, <fr_steer_joint_name> in the vehicle <controller>.
    traction_joints_names: [rr_wheel_joint, rl_wheel_joint]
    steering_joints_names: [fr_steer_joint, fl_steer_joint]

    wheelbase: 1.3  # f_wheels_x - rear wheels x
    traction_track_width: 2.0  # rear wheels y distance
    steering_track_width: 2.0  # f_wheels_d
    traction_wheels_radius: 0.31  # wheel diameter / 2

    # The same parameters for ROS 2 Humble (deprecated in Jazzy, which warns
    # about them, and ignored by newer versions):
    rear_wheels_names: [rr_wheel_joint, rl_wheel_joint]
    front_wheels_names: [fr_steer_joint, fl_steer_joint]
    rear_wheel_track: 2.0
    front_wheel_track: 2.0
    rear_wheels_radius: 0.31
    front_wheels_radius: 0.31  # unused, but required by Humble
    use_stamped_vel: true  # Humble: TwistStamped on ~/reference, as in newer versions

    position_feedback: false  # odometry from the traction joints velocity
    open_loop: false
    reference_timeout: 0.5  # s

    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
